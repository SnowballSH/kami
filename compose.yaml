# Kami with podman compose, podman-compose or docker compose. docs/hosting.md walks through it.
#
#   cp .env.example .env            # then fill in what you want (a model URL, access mode, ...)
#   podman compose up -d            # the game on http://localhost:8080, reading handwriting locally
#   podman compose --profile mongo up -d   # + MongoDB 8; set MONGODB_URI=mongodb://mongo:27017
#
# The kami container runs its own sidecar (handwriting, and Kami's Eye once a trained model is
# mounted at /models/kami-eye: uncomment the volume below).

services:
  kami:
    image: ghcr.io/snowballsh/kami:latest
    build: .
    ports:
      - "${KAMI_PUBLISH:-8080}:8080"
    volumes:
      - kami-data:/data
      # - ${KAMI_EYE_ARTIFACTS:-./ml/artifacts/kami-eye}:/models/kami-eye:ro
      # A public server: a file holding one password, with KAMI_PASSWORD_FILE=/run/secrets/kami-password
      # and KAMI_ALLOWED_ORIGINS in .env, and KAMI_PUBLISH=127.0.0.1:8080 behind an HTTPS proxy.
      # - ./kami-password:/run/secrets/kami-password:ro
    env_file:
      - path: .env
        required: false
    environment:
      KAMI_RECOGNIZER_URL: ${KAMI_RECOGNIZER_URL:-}
      MONGODB_URI: ${MONGODB_URI:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mongo:
    profiles: [mongo]
    image: docker.io/library/mongo:8
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  kami-data:
  mongo-data:
