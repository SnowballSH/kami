# Kami with podman compose, podman-compose or docker compose. docs/hosting.md walks through it.
#
#   cp .env.example .env            # then fill in what you want (a model URL, access mode, ...)
#   podman compose up -d            # the game on http://localhost:8080
#   podman compose --profile eye up -d     # + Kami's Eye; set KAMI_RECOGNIZER_URL=http://eye:8790
#   podman compose --profile mongo up -d   # + MongoDB 8; set MONGODB_URI=mongodb://mongo:27017

services:
  kami:
    image: ghcr.io/snowballsh/kami:latest
    build: .
    ports:
      - "${KAMI_PUBLISH:-8080}:8080"
    volumes:
      - kami-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      KAMI_RECOGNIZER_URL: ${KAMI_RECOGNIZER_URL:-}
      MONGODB_URI: ${MONGODB_URI:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  eye:
    profiles: [eye]
    image: ghcr.io/snowballsh/kami-eye:latest
    build: ./ml
    volumes:
      - ${KAMI_EYE_ARTIFACTS:-./ml/artifacts/kami-eye}:/models/kami-eye:ro
    environment:
      KAMI_EYE_THREADS: ${KAMI_EYE_THREADS:-1}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mongo:
    profiles: [mongo]
    image: docker.io/library/mongo:8
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  kami-data:
  mongo-data:
