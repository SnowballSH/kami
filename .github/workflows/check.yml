name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript, Biome, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  lightweight:
    name: Python and shell (no models)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.13"
          enable-cache: false
      - run: bash scripts/ci/lightweight.sh
      - name: Record checks that need separate equipment
        if: always()
        run: |
          {
            echo '### Equipment checks not run by hosted CI'
            echo '- Model inference, training tests and golden parity: need a machine with the model artifacts and training dependencies. See scripts/ci/README.md.'
            echo '- Optional cabinet: firmware compilation, serial input and physical controls require separate verification.'
            echo '- Passing these jobs does not certify models or the cabinet.'
          } >> "$GITHUB_STEP_SUMMARY"
